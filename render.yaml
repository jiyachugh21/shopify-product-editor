services:

- type: web
  name: shopify-product-editor
  runtime: docker
  plan: free
  envVars:
  - key: DATABASE_URL
    fromDatabase:
      name: shopify-product-editor-db
      property: connectionString
  - key: SHOPIFY_API_KEY
    sync: false
  - key: SHOPIFY_API_SECRET
    sync: false
  - key: SCOPES
    value: write_products
  - key: SHOPIFY_APP_URL
    sync: false
  - key: NODE_ENV
    value: production

databases:

- name: shopify-product-editor-db
  plan: free
